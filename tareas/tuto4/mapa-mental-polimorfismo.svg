<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1523" viewBox="0 0 2400 1523" font-family="Trebuchet MS, Verdana, Arial, sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F4F7FB"/><stop offset="100%" stop-color="#E7EEF9"/></linearGradient>
<radialGradient id="coreGrad" cx="50%" cy="35%" r="75%"><stop offset="0%" stop-color="#7B6CF6"/><stop offset="55%" stop-color="#4A3FD6"/><stop offset="100%" stop-color="#2E258F"/></radialGradient>
<filter id="shadow" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.16"/></filter>
<filter id="coreShadow" x="-30%" y="-30%" width="170%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2E258F" flood-opacity="0.35"/></filter>
</defs>
<rect width="2400" height="1523" fill="url(#bg)"/>
<text x="1200" y="78" text-anchor="middle" font-size="48" font-weight="bold" fill="#2E258F">MAPA MENTAL · EL POLIMORFISMO EN LA POO</text>
<text x="1200" y="120" text-anchor="middle" font-size="23" fill="#5A6473" font-style="italic">La capacidad de que un mismo mensaje adopte "muchas formas" según el objeto</text>
<path d="M 1415 821 C 1522.5 821, 1522.5 405.5, 1630 405.5" fill="none" stroke="#FF6B6B" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
<path d="M 1415 821 C 1522.5 821, 1522.5 824.5, 1630 824.5" fill="none" stroke="#4ECDC4" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
<path d="M 1415 821 C 1522.5 821, 1522.5 1240.5, 1630 1240.5" fill="none" stroke="#FFD93D" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
<path d="M 985 821 C 877.5 821, 877.5 377.0, 770 377.0" fill="none" stroke="#6C5CE7" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
<path d="M 985 821 C 877.5 821, 877.5 740.5, 770 740.5" fill="none" stroke="#00B894" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
<path d="M 985 821 C 877.5 821, 877.5 1090.5, 770 1090.5" fill="none" stroke="#E17055" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
<ellipse cx="1200" cy="821" rx="220" ry="134" fill="url(#coreGrad)" filter="url(#coreShadow)"/>
<ellipse cx="1200" cy="821" rx="220" ry="134" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.6"/>
<text x="1200" y="783" text-anchor="middle" font-size="42" font-weight="bold" fill="#FFFFFF">POLIMORFISMO</text>
<text x="1200" y="829" text-anchor="middle" font-size="31" font-weight="bold" fill="#D9D4FF">EN LA POO</text>
<text x="1200" y="879" text-anchor="middle" font-size="21" fill="#CFC8FF" font-style="italic">griego: polymorphos = "muchas formas"</text>
<rect x="1630" y="210" width="700" height="391" rx="22" fill="#FFFFFF" filter="url(#shadow)"/>
<path d="M 1630 232 Q 1630 210 1652 210 L 2308 210 Q 2330 210 2330 232 L 2330 274 L 1630 274 Z" fill="#FF6B6B"/>
<rect x="1630" y="274" width="10" height="327" fill="#FF6B6B" opacity="0.9"/>
<text x="1656" y="236" font-size="27" font-weight="bold" fill="#FFFFFF">1. Asignación polimórfica</text>
<circle cx="1660" cy="309" r="5" fill="#FF6B6B"/>
<text x="1680" y="315" font-size="20" fill="#333A45">Una variable de tipo general (clase padre) puede guardar</text>
<text x="1680" y="342" font-size="20" fill="#333A45">objetos de sus clases hijas.</text>
<circle cx="1660" cy="372" r="5" fill="#FF6B6B"/>
<text x="1680" y="378" font-size="20" fill="#333A45">El compilador ve un tipo estático, pero en ejecución manda</text>
<text x="1680" y="405" font-size="20" fill="#333A45">el tipo real del objeto.</text>
<circle cx="1660" cy="435" r="5" fill="#FF6B6B"/>
<text x="1680" y="441" font-size="20" fill="#333A45">Ejemplo: una variable Animal puede referirse a un Perro o a</text>
<text x="1680" y="468" font-size="20" fill="#333A45">un Gato.</text>
<circle cx="1660" cy="498" r="5" fill="#FF6B6B"/>
<text x="1680" y="504" font-size="20" fill="#333A45">Al llamar hacerSonido(), cada objeto responde de forma</text>
<text x="1680" y="531" font-size="20" fill="#333A45">distinta.</text>
<circle cx="1660" cy="561" r="5" fill="#FF6B6B"/>
<text x="1680" y="567" font-size="20" fill="#333A45">Favorece la reutilización y la extensibilidad del código.</text>
<rect x="1630" y="647" width="700" height="355" rx="22" fill="#FFFFFF" filter="url(#shadow)"/>
<path d="M 1630 669 Q 1630 647 1652 647 L 2308 647 Q 2330 647 2330 669 L 2330 711 L 1630 711 Z" fill="#4ECDC4"/>
<rect x="1630" y="711" width="10" height="291" fill="#4ECDC4" opacity="0.9"/>
<text x="1656" y="673" font-size="27" font-weight="bold" fill="#FFFFFF">2. Tipos estáticos y dinámicos</text>
<circle cx="1660" cy="746" r="5" fill="#4ECDC4"/>
<text x="1680" y="752" font-size="20" fill="#333A45">El tipo estático se declara en el código fuente y el</text>
<text x="1680" y="779" font-size="20" fill="#333A45">compilador lo verifica.</text>
<circle cx="1660" cy="809" r="5" fill="#4ECDC4"/>
<text x="1680" y="815" font-size="20" fill="#333A45">El tipo dinámico se adquiere en ejecución y decide qué</text>
<text x="1680" y="842" font-size="20" fill="#333A45">implementación corre.</text>
<circle cx="1660" cy="872" r="5" fill="#4ECDC4"/>
<text x="1680" y="878" font-size="20" fill="#333A45">Conviven: dan seguridad al compilar y flexibilidad al</text>
<text x="1680" y="905" font-size="20" fill="#333A45">ejecutar.</text>
<circle cx="1660" cy="935" r="5" fill="#4ECDC4"/>
<text x="1680" y="941" font-size="20" fill="#333A45">Ejemplo: una variable Figura puede ser un Círculo o un</text>
<text x="1680" y="968" font-size="20" fill="#333A45">Cuadrado.</text>
<rect x="1630" y="1048" width="700" height="385" rx="22" fill="#FFFFFF" filter="url(#shadow)"/>
<path d="M 1630 1070 Q 1630 1048 1652 1048 L 2308 1048 Q 2330 1048 2330 1070 L 2330 1142 L 1630 1142 Z" fill="#FFD93D"/>
<rect x="1630" y="1142" width="10" height="291" fill="#FFD93D" opacity="0.9"/>
<text x="1656" y="1074" font-size="27" font-weight="bold" fill="#FFFFFF">3. Herencia y sistemas de</text>
<text x="1656" y="1104" font-size="27" font-weight="bold" fill="#FFFFFF">tipos</text>
<circle cx="1660" cy="1177" r="5" fill="#FFD93D"/>
<text x="1680" y="1183" font-size="20" fill="#333A45">Las subclases heredan atributos y comportamientos de la</text>
<text x="1680" y="1210" font-size="20" fill="#333A45">superclase.</text>
<circle cx="1660" cy="1240" r="5" fill="#FFD93D"/>
<text x="1680" y="1246" font-size="20" fill="#333A45">Cada subclase puede sobrescribir métodos para especializar</text>
<text x="1680" y="1273" font-size="20" fill="#333A45">su comportamiento.</text>
<circle cx="1660" cy="1303" r="5" fill="#FFD93D"/>
<text x="1680" y="1309" font-size="20" fill="#333A45">La jerarquía comparte una estructura común y permite</text>
<text x="1680" y="1336" font-size="20" fill="#333A45">especializar cada clase.</text>
<circle cx="1660" cy="1366" r="5" fill="#FFD93D"/>
<text x="1680" y="1372" font-size="20" fill="#333A45">Un objeto de subclase puede tratarse como objeto de su</text>
<text x="1680" y="1399" font-size="20" fill="#333A45">superclase.</text>
<rect x="70" y="210" width="700" height="334" rx="22" fill="#FFFFFF" filter="url(#shadow)"/>
<path d="M 70 232 Q 70 210 92 210 L 748 210 Q 770 210 770 232 L 770 280 L 70 280 Z" fill="#6C5CE7"/>
<rect x="70" y="280" width="10" height="264" fill="#6C5CE7" opacity="0.9"/>
<text x="96" y="236" font-size="27" font-weight="bold" fill="#FFFFFF">4. Compatibilidad de tipos</text>
<text x="96" y="268" font-size="15" fill="#FFFFFF" opacity="0.9" font-style="italic">(Principio de Sustitución de Liskov)</text>
<circle cx="100" cy="315" r="5" fill="#6C5CE7"/>
<text x="120" y="321" font-size="20" fill="#333A45">Una subclase puede sustituir a su superclase sin romper el</text>
<text x="120" y="348" font-size="20" fill="#333A45">programa.</text>
<circle cx="100" cy="378" r="5" fill="#6C5CE7"/>
<text x="120" y="384" font-size="20" fill="#333A45">Los objetos de la clase base se reemplazan por objetos de</text>
<text x="120" y="411" font-size="20" fill="#333A45">sus subclases.</text>
<circle cx="100" cy="441" r="5" fill="#6C5CE7"/>
<text x="120" y="447" font-size="20" fill="#333A45">Se conservan las propiedades deseables del sistema.</text>
<circle cx="100" cy="477" r="5" fill="#6C5CE7"/>
<text x="120" y="483" font-size="20" fill="#333A45">Se conoce como Principio de Sustitución de Liskov (Liskov &amp;</text>
<text x="120" y="510" font-size="20" fill="#333A45">Wing, 1994).</text>
<rect x="70" y="590" width="700" height="301" rx="22" fill="#FFFFFF" filter="url(#shadow)"/>
<path d="M 70 612 Q 70 590 92 590 L 748 590 Q 770 590 770 612 L 770 654 L 70 654 Z" fill="#00B894"/>
<rect x="70" y="654" width="10" height="237" fill="#00B894" opacity="0.9"/>
<text x="96" y="616" font-size="27" font-weight="bold" fill="#FFFFFF">5. Sobrecarga de métodos</text>
<circle cx="100" cy="689" r="5" fill="#00B894"/>
<text x="120" y="695" font-size="20" fill="#333A45">Varios métodos comparten el mismo nombre pero tienen</text>
<text x="120" y="722" font-size="20" fill="#333A45">distintos parámetros.</text>
<circle cx="100" cy="752" r="5" fill="#00B894"/>
<text x="120" y="758" font-size="20" fill="#333A45">Se resuelve en tiempo de compilación, según los argumentos</text>
<text x="120" y="785" font-size="20" fill="#333A45">de la llamada.</text>
<circle cx="100" cy="815" r="5" fill="#00B894"/>
<text x="120" y="821" font-size="20" fill="#333A45">Ejemplo: imprimir(int), imprimir(String) e imprimir(Object).</text>
<circle cx="100" cy="851" r="5" fill="#00B894"/>
<text x="120" y="857" font-size="20" fill="#333A45">Mejora la legibilidad y reduce la duplicación de código.</text>
<rect x="70" y="937" width="700" height="307" rx="22" fill="#FFFFFF" filter="url(#shadow)"/>
<path d="M 70 959 Q 70 937 92 937 L 748 937 Q 770 937 770 959 L 770 1007 L 70 1007 Z" fill="#E17055"/>
<rect x="70" y="1007" width="10" height="237" fill="#E17055" opacity="0.9"/>
<text x="96" y="963" font-size="27" font-weight="bold" fill="#FFFFFF">6. Sobrescritura de métodos</text>
<text x="96" y="995" font-size="15" fill="#FFFFFF" opacity="0.9" font-style="italic">(Override)</text>
<circle cx="100" cy="1042" r="5" fill="#E17055"/>
<text x="120" y="1048" font-size="20" fill="#333A45">La subclase redefine un método heredado de la superclase.</text>
<circle cx="100" cy="1078" r="5" fill="#E17055"/>
<text x="120" y="1084" font-size="20" fill="#333A45">Se resuelve en tiempo de ejecución, según el tipo real del</text>
<text x="120" y="1111" font-size="20" fill="#333A45">objeto.</text>
<circle cx="100" cy="1141" r="5" fill="#E17055"/>
<text x="120" y="1147" font-size="20" fill="#333A45">Es lo opuesto a la sobrecarga, que se resuelve al compilar.</text>
<circle cx="100" cy="1177" r="5" fill="#E17055"/>
<text x="120" y="1183" font-size="20" fill="#333A45">Permite que cada clase aporte su propia versión del</text>
<text x="120" y="1210" font-size="20" fill="#333A45">comportamiento.</text>
<text x="70" y="1491" font-size="16" fill="#8A93A3">Elementos de Programación Orientada a Objetos · Grupo 1</text>
<text x="2330" y="1491" text-anchor="end" font-size="16" fill="#8A93A3">Fuente: Asignación polimórfica · Guía Unidad 4 (POO)</text>
</svg>