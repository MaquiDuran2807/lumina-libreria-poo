<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1200" height="1060" fill="#ffffff" rx="12"/>
  <text x="600" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">Lumina Librería — Diagrama Preliminar (modelo completo, sin servicios/UI)</text>
  <text x="600" y="58" text-anchor="middle" font-size="13" fill="#666">10 clases del dominio · líneas ortogonales sin cruces · rombo blanco = agregación · rombo negro = composición · triángulo = herencia</text>

  <!-- ===== COLUMNA IZQUIERDA ===== -->
  <g id="persona">
    <rect x="40" y="90" width="270" height="250" fill="#fff" stroke="#222" stroke-width="2" rx="6"/>
    <rect x="40" y="90" width="270" height="52" fill="#EDE7F6" stroke="#222" stroke-width="2" rx="6"/>
    <rect x="40" y="120" width="270" height="22" fill="#EDE7F6" stroke="none"/>
    <text x="175" y="112" text-anchor="middle" font-size="11" fill="#555">«abstract»</text>
    <text x="175" y="132" text-anchor="middle" font-size="16" font-weight="bold">Persona</text>
    <line x1="40" y1="142" x2="310" y2="142" stroke="#222" stroke-width="2"/>
    <text x="52" y="164" font-size="13" fill="#333"># id : String</text>
    <text x="52" y="186" font-size="13" fill="#333"># nombre : String</text>
    <text x="52" y="208" font-size="13" fill="#333"># email : String</text>
    <text x="52" y="230" font-size="13" fill="#333"># telefono : String</text>
    <line x1="40" y1="244" x2="310" y2="244" stroke="#222" stroke-width="1.5"/>
    <text x="52" y="266" font-size="13" fill="#4A148C">+ getTipo() : String</text>
    <text x="52" y="288" font-size="13" fill="#4A148C">+ toRow() : String[]</text>
    <text x="52" y="310" font-size="11" fill="#777">Ej: Sofía, Diego (personas)</text>
  </g>

  <g id="cliente">
    <rect x="40" y="390" width="270" height="280" fill="#fff" stroke="#222" stroke-width="2" rx="6"/>
    <rect x="40" y="390" width="270" height="44" fill="#E3F2FD" stroke="#222" stroke-width="2" rx="6"/>
    <rect x="40" y="414" width="270" height="20" fill="#E3F2FD" stroke="none"/>
    <text x="175" y="418" text-anchor="middle" font-size="16" font-weight="bold">Cliente</text>
    <line x1="40" y1="434" x2="310" y2="434" stroke="#222" stroke-width="2"/>
    <text x="52" y="458" font-size="13" fill="#333">- puntosFidelidad : int</text>
    <text x="52" y="480" font-size="13" fill="#333">- totalCompras : int</text>
    <text x="52" y="502" font-size="11" fill="#777">(hereda id, nombre, email)</text>
    <line x1="40" y1="516" x2="310" y2="516" stroke="#222" stroke-width="1.5"/>
    <text x="52" y="540" font-size="13" fill="#0D47A1">+ getNivel() : NivelCliente</text>
    <text x="52" y="562" font-size="13" fill="#0D47A1">+ agregarCompra(v : double) : void</text>
    <text x="52" y="584" font-size="13" fill="#0D47A1">+ getDescuentoNivel() : double</text>
    <rect x="52" y="596" width="246" height="58" fill="#F5F5F5" stroke="#BBB" rx="4"/>
    <text x="62" y="616" font-size="11" fill="#555">Ej: C-001 Sofía (Diamante)</text>
    <text x="62" y="634" font-size="11" fill="#555">C-002 Diego (Oro)</text>
  </g>

  <g id="nivel">
    <rect x="40" y="720" width="270" height="200" fill="#fff" stroke="#222" stroke-width="2" rx="6"/>
    <rect x="40" y="720" width="270" height="44" fill="#E0F7FA" stroke="#222" stroke-width="2" rx="6"/>
    <rect x="40" y="744" width="270" height="20" fill="#E0F7FA" stroke="none"/>
    <text x="175" y="748" text-anchor="middle" font-size="16" font-weight="bold">NivelCliente</text>
    <text x="258" y="748" font-size="11" fill="#555">«enum»</text>
    <line x1="40" y1="764" x2="310" y2="764" stroke="#222" stroke-width="2"/>
    <text x="52" y="786" font-size="12" fill="#333">BRONCE (0%) · PLATA (5%)</text>
    <text x="52" y="806" font-size="12" fill="#333">ORO (10%) · DIAMANTE (15%)</text>
    <line x1="40" y1="820" x2="310" y2="820" stroke="#222" stroke-width="1.5"/>
    <text x="52" y="842" font-size="12" fill="#006064">+ getDescuento() : double</text>
    <text x="52" y="862" font-size="12" fill="#006064">+ porPuntos(p) : NivelCliente</text>
    <text x="52" y="884" font-size="11" fill="#777">Ej: 1200 pts → DIAMANTE</text>
  </g>

  <!-- ===== CENTRO-TOP ===== -->
  <g id="producto">
    <rect x="380" y="90" width="300" height="300" fill="#fff" stroke="#222" stroke-width="2" rx="6"/>
    <rect x="380" y="90" width="300" height="52" fill="#FFF3E0" stroke="#222" stroke-width="2" rx="6"/>
    <rect x="380" y="120" width="300" height="22" fill="#FFF3E0" stroke="none"/>
    <text x="530" y="112" text-anchor="middle" font-size="11" fill="#555">«abstract»</text>
    <text x="530" y="132" text-anchor="middle" font-size="16" font-weight="bold">Producto</text>
    <line x1="380" y1="142" x2="680" y2="142" stroke="#222" stroke-width="2"/>
    <text x="392" y="164" font-size="13" fill="#333"># id : String</text>
    <text x="392" y="186" font-size="13" fill="#333"># nombre : String</text>
    <text x="392" y="208" font-size="13" fill="#333"># precioVenta : double</text>
    <text x="392" y="230" font-size="13" fill="#333"># stock : int · # stockMinimo</text>
    <line x1="380" y1="244" x2="680" y2="244" stroke="#222" stroke-width="1.5"/>
    <text x="392" y="266" font-size="13" fill="#9C4100">+ vender(cant) : boolean</text>
    <text x="392" y="288" font-size="13" fill="#9C4100">+ reponer(cant) : void</text>
    <text x="392" y="310" font-size="13" fill="#9C4100">+ calcularMargen() : double</text>
    <text x="392" y="332" font-size="13" fill="#9C4100">+ getDetalleEspecifico() : String</text>
    <text x="392" y="356" font-size="11" fill="#777">Ej: L-001 · U-001 · R-001</text>
  </g>

  <g id="categoria">
    <rect x="730" y="90" width="200" height="210" fill="#fff" stroke="#222" stroke-width="2" rx="6"/>
    <rect x="730" y="90" width="200" height="44" fill="#F3E5F5" stroke="#222" stroke-width="2" rx="6"/>
    <rect x="730" y="114" width="200" height="20" fill="#F3E5F5" stroke="none"/>
    <text x="830" y="118" text-anchor="middle" font-size="15" font-weight="bold">Categoria</text>
    <text x="906" y="118" font-size="10" fill="#555">«enum»</text>
    <line x1="730" y1="134" x2="930" y2="134" stroke="#222" stroke-width="2"/>
    <text x="742" y="156" font-size="11.5" fill="#333">LIBRO_FICCION</text>
    <text x="742" y="174" font-size="11.5" fill="#333">LIBRO_INFANTIL</text>
    <text x="742" y="192" font-size="11.5" fill="#333">LIBRO_ACADEMICO</text>
    <text x="742" y="210" font-size="11.5" fill="#333">UTILES · ARTE · REVISTA</text>
    <text x="742" y="232" font-size="11" fill="#777">Ej: L-001 → FICCION</text>
    <text x="742" y="250" font-size="11" fill="#777">U-002 → ARTE</text>
  </g>

  <!-- ===== SUBCLASES ===== -->
  <g id="libro">
    <rect x="380" y="440" width="200" height="190" fill="#fff" stroke="#222" stroke-width="2" rx="6"/>
    <rect x="380" y="440" width="200" height="38" fill="#FFF8E1" stroke="#222" stroke-width="2" rx="6"/>
    <rect x="380" y="460" width="200" height="18" fill="#FFF8E1" stroke="none"/>
    <text x="480" y="464" text-anchor="middle" font-size="15" font-weight="bold">Libro</text>
    <line x1="380" y1="478" x2="580" y2="478" stroke="#222" stroke-width="2"/>
    <text x="390" y="500" font-size="12" fill="#333">- autor : String</text>
    <text x="390" y="520" font-size="12" fill="#333">- editorial : String</text>
    <text x="390" y="540" font-size="12" fill="#333">- isbn : String</text>
    <text x="390" y="560" font-size="11" fill="#777">hereda vender(), margen</text>
    <text x="390" y="578" font-size="11" fill="#777">Ej: García Márquez</text>
  </g>
  <g id="util">
    <rect x="600" y="440" width="200" height="190" fill="#fff" stroke="#222" stroke-width="2" rx="6"/>
    <rect x="600" y="440" width="200" height="38" fill="#FFF8E1" stroke="#222" stroke-width="2" rx="6"/>
    <rect x="600" y="460" width="200" height="18" fill="#FFF8E1" stroke="none"/>
    <text x="700" y="464" text-anchor="middle" font-size="14" font-weight="bold">UtilEscolar</text>
    <line x1="600" y1="478" x2="800" y2="478" stroke="#222" stroke-width="2"/>
    <text x="610" y="500" font-size="12" fill="#333">- marca : String</text>
    <text x="610" y="520" font-size="12" fill="#333">- tipoUtil : String</text>
    <text x="610" y="540" font-size="11" fill="#777">(hereda id, precio, stock)</text>
    <text x="610" y="560" font-size="11" fill="#777">hereda vender(), margen</text>
    <text x="610" y="578" font-size="11" fill="#777">Ej: Faber-Castell</text>
  </g>
  <g id="revista">
    <rect x="820" y="440" width="200" height="190" fill="#fff" stroke="#222" stroke-width="2" rx="6"/>
    <rect x="820" y="440" width="200" height="38" fill="#FFF8E1" stroke="#222" stroke-width="2" rx="6"/>
    <rect x="820" y="460" width="200" height="18" fill="#FFF8E1" stroke="none"/>
    <text x="920" y="464" text-anchor="middle" font-size="15" font-weight="bold">Revista</text>
    <line x1="820" y1="478" x2="1020" y2="478" stroke="#222" stroke-width="2"/>
    <text x="830" y="500" font-size="12" fill="#333">- edicion : String</text>
    <text x="830" y="520" font-size="12" fill="#333">- periodicidad : String</text>
    <text x="830" y="540" font-size="11" fill="#777">(hereda id, precio, stock)</text>
    <text x="830" y="560" font-size="11" fill="#777">hereda vender(), margen</text>
    <text x="830" y="578" font-size="11" fill="#777">Ej: N° 412 Mensual</text>
  </g>

  <!-- ===== VENTA + DETALLE ===== -->
  <g id="venta">
    <rect x="380" y="680" width="280" height="270" fill="#fff" stroke="#222" stroke-width="2" rx="6"/>
    <rect x="380" y="680" width="280" height="44" fill="#E8F5E9" stroke="#222" stroke-width="2" rx="6"/>
    <rect x="380" y="704" width="280" height="20" fill="#E8F5E9" stroke="none"/>
    <text x="520" y="708" text-anchor="middle" font-size="16" font-weight="bold">Venta</text>
    <line x1="380" y1="724" x2="660" y2="724" stroke="#222" stroke-width="2"/>
    <text x="392" y="748" font-size="13" fill="#333">- id : String</text>
    <text x="392" y="770" font-size="13" fill="#333">- fecha : LocalDateTime</text>
    <text x="392" y="792" font-size="13" fill="#333">- tasaDescuento : double</text>
    <line x1="380" y1="806" x2="660" y2="806" stroke="#222" stroke-width="1.5"/>
    <text x="392" y="830" font-size="13" fill="#1B5E20">+ agregarDetalle(p, c) : void</text>
    <text x="392" y="852" font-size="13" fill="#1B5E20">+ getTotalFinal() : double</text>
    <text x="392" y="874" font-size="13" fill="#1B5E20">+ getIva() : double</text>
    <text x="392" y="896" font-size="11" fill="#777">Ej: V-1001 · Sofía · $142.800</text>
  </g>

  <g id="detalle">
    <rect x="700" y="680" width="280" height="270" fill="#fff" stroke="#222" stroke-width="2" rx="6"/>
    <rect x="700" y="680" width="280" height="44" fill="#E0F1FB" stroke="#222" stroke-width="2" rx="6"/>
    <rect x="700" y="704" width="280" height="20" fill="#E0F1FB" stroke="none"/>
    <text x="840" y="708" text-anchor="middle" font-size="15" font-weight="bold">DetalleVenta</text>
    <line x1="700" y1="724" x2="980" y2="724" stroke="#222" stroke-width="2"/>
    <text x="712" y="748" font-size="13" fill="#333">- cantidad : int</text>
    <text x="712" y="770" font-size="13" fill="#333">- precioUnitario : double</text>
    <text x="712" y="792" font-size="11" fill="#777">(subtotal = cant × precio)</text>
    <line x1="700" y1="806" x2="980" y2="806" stroke="#222" stroke-width="1.5"/>
    <text x="712" y="830" font-size="13" fill="#01579B">+ getSubtotal() : double</text>
    <text x="712" y="852" font-size="13" fill="#01579B">+ getGanancia() : double</text>
    <text x="712" y="874" font-size="11" fill="#777">Ej: L-001 ×2 → $90.000</text>
  </g>

  <!-- ===== LEYENDA ===== -->
  <g id="leyenda">
    <rect x="1000" y="680" width="160" height="270" fill="#FAFAFA" stroke="#999" stroke-width="1.5" rx="6"/>
    <text x="1012" y="704" font-size="13" font-weight="bold">Leyenda</text>
    <text x="1012" y="726" font-size="11">△ herencia</text>
    <text x="1012" y="744" font-size="11">(es-un)</text>
    <text x="1012" y="766" font-size="11">◇ agregación</text>
    <text x="1012" y="784" font-size="11">(usa, vive sin mí)</text>
    <text x="1012" y="806" font-size="11">◆ composición</text>
    <text x="1012" y="824" font-size="11">(contiene, muere</text>
    <text x="1012" y="840" font-size="11">conmigo)</text>
    <text x="1012" y="864" font-size="11">- privado</text>
    <text x="1012" y="882" font-size="11">+ público</text>
    <text x="1012" y="900" font-size="11"># protegido</text>
  </g>

  <!-- ===== RELACIONES SIN CRUCES ===== -->
  <!-- 1. Persona <|-- Cliente -->
  <line x1="175" y1="345" x2="175" y2="385" stroke="#222" stroke-width="2"/>
  <polygon points="175,340 167,354 183,354" fill="#fff" stroke="#222" stroke-width="2"/>
  <rect x="188" y="354" width="72" height="20" fill="#fff" stroke="#222" rx="4"/>
  <text x="224" y="368" text-anchor="middle" font-size="11">es-un</text>

  <!-- 2. Cliente *-- NivelCliente : tiene -->
  <line x1="175" y1="675" x2="175" y2="715" stroke="#222" stroke-width="2"/>
  <polygon points="175,670 167,682 175,694 183,682" fill="#222" stroke="#222"/>
  <rect x="188" y="682" width="88" height="20" fill="#fff" stroke="#222" rx="4"/>
  <text x="232" y="696" text-anchor="middle" font-size="11">tiene 1-1</text>

  <!-- 3. Producto *-- Categoria -->
  <line x1="685" y1="180" x2="725" y2="180" stroke="#222" stroke-width="2"/>
  <polygon points="680,180 692,172 692,188" fill="#222" stroke="#222" transform="rotate(180 686,180)"/>
  <polygon points="680,180 672,168 672,192 688,192 688,168" fill="#222" stroke="#222" style="display:none"/>
  <polygon points="680,180 672,172 680,164 688,172 688,188 680,196 672,188 672,172" fill="#222" stroke="#222" style="display:none"/>
  <g>
    <polygon points="680,180 672,172 680,164 688,172 680,180 688,188 680,196 672,188" fill="#222" stroke="#222"/>
  </g>
  <rect x="560" y="156" width="132" height="20" fill="#fff" stroke="#222" rx="4"/>
  <text x="626" y="170" text-anchor="middle" font-size="11">clasificado en</text>

  <!-- 4. Herencia Producto -> Libro/Util/Revista (bus con un solo triangulo) -->
  <polygon points="530,390 522,404 538,404" fill="#fff" stroke="#222" stroke-width="2"/>
  <polyline points="530,404 530,415 480,415 480,440" fill="none" stroke="#222" stroke-width="2"/>
  <polyline points="530,415 700,415 700,440" fill="none" stroke="#222" stroke-width="2"/>
  <polyline points="530,415 920,415 920,440" fill="none" stroke="#222" stroke-width="2"/>

  <!-- 5. Venta o-- Cliente : atiende a (canal x=340) -->
  <polyline points="380,815 340,815 340,525 310,525" fill="none" stroke="#222" stroke-width="2"/>
  <polygon points="380,815 368,807 368,823" fill="#fff" stroke="#222" stroke-width="2"/>
  <polygon points="380,815 392,807 392,823 380,815" fill="#fff" stroke="#222" stroke-width="2" style="display:none"/>
  <g><polygon points="380,815 372,807 372,823 380,815 388,823 388,807" fill="#fff" stroke="#222" stroke-width="2"/></g>
  <rect x="200" y="640" width="116" height="20" fill="#fff" stroke="#222" rx="4"/>
  <text x="258" y="654" text-anchor="middle" font-size="11">atiende a 1-1</text>

  <!-- 6. Venta *-- Detalle : contiene -->
  <line x1="665" y1="815" x2="695" y2="815" stroke="#222" stroke-width="2"/>
  <polygon points="660,815 668,807 668,823 676,815 668,823 668,807" fill="#222" stroke="#222"/>
  <rect x="600" y="790" width="90" height="20" fill="#fff" stroke="#222" rx="4"/>
  <text x="645" y="804" text-anchor="middle" font-size="11">contiene</text>

  <!-- 7. Detalle o-- Producto : refiere a (corredor y=655, canal x=360) -->
  <polyline points="750,680 750,655 360,655 360,250 380,250" fill="none" stroke="#222" stroke-width="2"/>
  <polygon points="750,680 742,668 758,668" fill="#fff" stroke="#222" stroke-width="2"/>
  <g><polygon points="750,680 742,692 742,668 750,656 758,668 758,692" fill="#fff" stroke="#222" stroke-width="2" style="display:none"/></g>
  <rect x="500" y="638" width="110" height="20" fill="#fff" stroke="#222" rx="4"/>
  <text x="555" y="652" text-anchor="middle" font-size="11">refiere a *</text>

  <text x="600" y="1030" text-anchor="middle" font-size="11" fill="#888">docs/diagrama-preliminar.svg → python docs/generar_png.py → diagrama-preliminar.png · preliminar = solo modelo (sin services/UI)</text>
</svg>
